<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpsonTV-Series</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="encabezado-fijo">
      <div class="tv-marca">SimpsonTV</div>
      <nav class="tv-botones-top" aria-label="Navegación principal">
        <a href="./index.html" class="tv-btn-control">Inicio</a>
        <a href="./catalogo.html" class="tv-btn-control">Catálogo</a>
      </nav>
    </header>

    <main>
      <h1>Catalogo de Series por ver</h1>

      <form class="controles" onsubmit="return false">
        <div class="campo">
          <label for="buscador">Buscar por nombre</label>
          <input
            type="search"
            id="buscador"
            placeholder="In English, please"
            autocomplete="off"
          />
        </div>

       <div class="campo">
          <label for="genero">Filtrar por genero</label>
          <select id="genero">
            <option value="todas">Todas</option>
          </select>
        </div>
      </form>

      <p id="estado" class="estado" role="status"></p>

      <section id="grilla" class="grilla" aria-label="Series"></section>
    </main>

    <footer class="pie">
      <p>SimpsonsTV · <span id="anio">2026</span></p>
      <p>Datos: <a href="https://www.tvmaze.com/api">TVMaze API</a></p>
    </footer>

    <script type="module" src="./src/catalogo.js"></script>
  </body>
</html>
